[project]
name = "project-tracker"
version = "0.1.0"
description = "A full backend project tracker with a REST API built with FastAPI."
readme = "README.md"
authors = [
    { name = "Alejandro Paños" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
]

[project.scripts]
project-tracker = "project_tracker:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
